[package]
name = "inkdown"
version = "1.1.0"
description = "A premium, privacy-first rich text and Markdown converter."
authors = ["Aditya Pandya"]
license = "MIT"
homepage = "https://github.com/aditya-pandya/Inkdown"
repository = "https://github.com/aditya-pandya/Inkdown"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "inkdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
