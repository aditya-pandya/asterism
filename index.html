<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
    <title>Inkdown</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/turndown.js"></script>
    <script src="vendor/turndown-plugin-gfm.js"></script>
</head>
<body>
    <div class="inkdown" id="app" data-mode="light">
        <header class="wordmark-strip" id="wordmarkStrip" aria-label="Inkdown window title">
            <span>INKDOWN</span>
        </header>

        <main class="workspace" id="editView">
            <section class="pane rich-pane" id="richPane" aria-labelledby="richLabel">
                <div class="pane-header">
                    <span class="pane-label" id="richLabel">RICH TEXT</span>
                    <div class="rich-actions">
                        <div class="format-toolbar" role="toolbar" aria-label="Rich text formatting">
                            <button class="format-tool tool-bold" data-command="bold" title="Bold ⌘B" aria-label="Bold">B</button>
                            <button class="format-tool tool-italic" data-command="italic" title="Italic ⌘I" aria-label="Italic">I</button>
                            <button class="format-tool tool-underline" data-command="underline" title="Underline ⌘U" aria-label="Underline">U</button>
                            <button class="format-tool tool-strike" data-command="strikeThrough" title="Strikethrough" aria-label="Strikethrough">S</button>
                            <button class="format-tool tool-code" data-command="code" title="Inline code" aria-label="Inline code">`</button>
                            <button class="format-tool" data-command="quote" title="Blockquote" aria-label="Blockquote">❝</button>
                            <button class="format-tool" data-command="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">•</button>
                            <button class="format-tool" data-command="insertOrderedList" title="Numbered list" aria-label="Numbered list">1.</button>
                            <button class="format-tool" data-command="insertHorizontalRule" title="Divider" aria-label="Divider">—</button>
                        </div>
                        <button class="text-action paste-action" id="pasteButton" title="Paste from clipboard">Paste&nbsp;&nbsp;⌘V</button>
                    </div>
                </div>
                <div class="rich-editor prose" id="richEditor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="Paste anything — ⌘V"></div>
            </section>

            <div class="pane-divider" aria-hidden="true"></div>

            <section class="pane markdown-pane" id="markdownPane" aria-labelledby="markdownLabel">
                <div class="pane-header">
                    <span class="pane-label" id="markdownLabel">MARKDOWN</span>
                    <div class="markdown-actions">
                        <button class="text-action" id="downloadButton" title="Download .md file">↓&nbsp; .md</button>
                        <button class="text-action copy-action" id="copyButton">Copy&nbsp;&nbsp;⌘⇧C</button>
                    </div>
                </div>
                <div class="markdown-stack">
                    <div class="markdown-highlight" id="markdownHighlight" aria-hidden="true"></div>
                    <div class="markdown-editor" id="markdownEditor" contenteditable="plaintext-only" role="textbox" aria-multiline="true" aria-label="Markdown editor" spellcheck="false" data-placeholder="Markdown appears here, instantly"></div>
                </div>
            </section>
        </main>

        <section class="reader-view" id="readerView" aria-label="Reader view" hidden>
            <article class="reader prose" id="readerContent"></article>
        </section>

        <footer class="command-bar" aria-label="Document commands">
            <span class="document-stats" id="documentStats">0 words, 0 characters</span>
            <span class="separator" aria-hidden="true">·</span>
            <button class="footer-action" id="clearButton">Clear</button>
            <span class="separator" aria-hidden="true">·</span>
            <button class="footer-action" id="openButton">Open&nbsp;⌘O</button>
            <span class="hint-group"><span class="separator" aria-hidden="true">·</span><span id="hintText">converted as you type</span></span>
            <span class="separator" aria-hidden="true">·</span>
            <button class="footer-action" id="readerButton">Reader&nbsp;⌘E</button>
            <span class="separator" aria-hidden="true">·</span>
            <button class="footer-action" id="settingsButton">Settings&nbsp;⌘,</button>
            <span class="separator" aria-hidden="true">·</span>
            <button class="footer-action" id="themeButton" title="Cycle appearance">◐&nbsp; Light</button>
        </footer>

        <input id="fileInput" type="file" accept=".md,.markdown,.txt,.html,.htm" hidden>

        <div class="drag-overlay" id="dragOverlay" aria-hidden="true" hidden>
            <div>
                <p>Drop to open</p>
                <span>.md, .txt or .html</span>
            </div>
        </div>

        <div class="settings-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
            <button class="settings-backdrop" id="settingsBackdrop" aria-label="Close settings"></button>
            <section class="settings-panel">
                <h2 id="settingsTitle">SETTINGS</h2>
                <div id="settingsRows"></div>
                <div class="setting-row saved-data-row">
                    <span>Saved data</span>
                    <button class="setting-option" id="clearSavedButton">Clear all</button>
                </div>
                <div class="settings-meta">
                    <p>Everything stays on this device — offline, no account.</p>
                    <p>Inkdown 2.0 · © 2026 Aditya Pandya · <a href="mailto:feedback@inkdown.app">Send feedback</a></p>
                    <p class="escape-hint">esc to close</p>
                </div>
            </section>
        </div>

        <div class="sr-status" id="statusMessage" role="status" aria-live="polite"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
